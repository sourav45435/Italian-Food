<svg viewBox="0 0 540 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Noi, la qualità srl logo">
  <defs>
    <radialGradient id="logoSphereDark" cx="38%" cy="32%" r="65%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#7ec6f8" />
      <stop offset="25%" stop-color="#3b8fe8" />
      <stop offset="65%" stop-color="#1e5cb8" />
      <stop offset="90%" stop-color="#113a7c" />
      <stop offset="100%" stop-color="#0b2959" />
    </radialGradient>
    <filter id="logoGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" flood-color="#000000" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Top-Left Green Waves -->
    <path
      d="M 100 88 C 130 88, 170 54, 218 52 C 248 51, 275 62, 286 67"
      stroke="#52baa2"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 100 125 C 135 125, 172 90, 222 88"
      stroke="#52baa2"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central 3D Blue Sphere -->
    <circle
      cx="276"
      cy="110"
      r="52"
      fill="url(#logoSphereDark)"
      filter="url(#logoGlowDark)"
    />

    <!-- Right Yellow/Orange Waves -->
    <path
      d="M 334 118 C 352 108, 385 90, 448 90"
      stroke="#f2a632"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 270 174 C 330 174, 380 128, 448 128"
      stroke="#f2a632"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Brand Text: "Noi," -->
    <text
      x="102"
      y="180"
      fill="#ffffff"
      font-family="'Arial Black', 'Trebuchet MS', 'Impact', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="48"
      letter-spacing="-1"
    >
      Noi,
    </text>

    <!-- Brand Text: "la qualità" -->
    <text
      x="190"
      y="235"
      fill="#ffffff"
      font-family="'Arial Black', 'Trebuchet MS', 'Impact', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="50"
      letter-spacing="-1"
    >
      la qualità
    </text>

    <!-- Registered symbol ® -->
    <text
      x="448"
      y="208"
      fill="#ffffff"
      font-family="Arial, sans-serif"
      font-weight="bold"
      font-size="17"
    >
      ®
    </text>

    <!-- "srl" below ® -->
    <text
      x="447"
      y="228"
      fill="#cbd5e1"
      font-family="Arial, sans-serif"
      font-weight="bold"
      font-style="italic"
      font-size="14"
    >
      srl
    </text>
  </g>
</svg>
